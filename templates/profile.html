
<!DOCTYPE html>
<html>
<head>
    <title>My Profile - TravelMate</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e3f2fd;
            text-align: center;
            padding: 40px;
        }

        .profile-box {
            background: white;
            padding: 30px;
            width: 450px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .profile-image {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            margin: 15px auto;
        }

        .username {
            color: #116b78;
            font-size: 22px;
        }

        button {
            background: #2196f3;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1976d2;
        }
    </style>
</head>

<body>

<div class="profile-box">

    <h2>My TravelMate Profile</h2>

    <h3 class="username">
        Welcome, {{ request.user.username }}!
    </h3>

    {% if profile.profile_image %}
        <img src="{{ profile.profile_image.url }}"
             alt="Profile Image"
             class="profile-image">
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <p>
            <b>Change Profile Image:</b>
        </p>

        <input type="file"
               name="profile_image"
               accept="image/*"
               required>

        <br><br>

        <button type="submit">
            Upload Profile Image
        </button>
    </form>

    <p>
        <a href="{% url 'dashboard' %}">
            Back to Dashboard
        </a>
    </p>

</div>

</body>
</html>
